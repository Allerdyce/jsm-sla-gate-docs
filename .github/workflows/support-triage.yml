name: EvidencePair LLC Support Triage Bot

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  triage-acknowledge:
    name: Tier-1 Support SLA Acknowledgment
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge Support Request & Apply Triage Label
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;
            const author = context.payload.issue.user.login;
            const defaultBranch = context.payload.repository.default_branch || 'main';
            const repoUrl = `https://github.com/${owner}/${repo}`;
            const userGuideUrl = `${repoUrl}/blob/${defaultBranch}/USER_GUIDE.md`;
            const privacySecurityUrl = `${repoUrl}/blob/${defaultBranch}/PRIVACY_AND_SECURITY.md`;

            // 1. Ensure 'triage-acknowledged' label exists in repository
            const labelName = 'triage-acknowledged';
            try {
              await github.rest.issues.getLabel({
                owner,
                repo,
                name: labelName,
              });
            } catch (err) {
              if (err.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: labelName,
                  color: '0052CC',
                  description: 'Acknowledged by EvidencePair LLC Tier-1 Support within 24-hour SLA',
                });
              }
            }

            // 2. Add 'triage-acknowledged' label to the opened issue
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: [labelName],
            });

            // 3. Post immediate Tier-1 response from EvidencePair LLC Support
            const body = [
              `Hello @${author},`,
              ``,
              `Thank you for contacting **EvidencePair LLC Support**. This automated Tier-1 response confirms that your support request (\`#${issueNumber}\`) has been received and logged in our engineering triage queue.`,
              ``,
              `### ⏱️ 24-Hour Support SLA & Next Steps`,
              `- **SLA Commitment:** An EvidencePair LLC support engineer will review your diagnostic details and respond within our **24-hour business SLA window** (Monday–Friday).`,
              `- **Direct Escalation & Private Diagnostics:** If you need to share tenant-specific screenshots or sensitive configuration details privately, please email **\`support@evidencepair.com\`** (or **\`support@titlecovenant.com\`**) and reference **\`${repo}#${issueNumber}\`** in the subject line.`,
              ``,
              `### 📚 Self-Service Documentation & Architecture Reference`,
              `While your ticket is being reviewed, please consult our official documentation for setup checklists, permission requirements, and zero-egress architecture specifications:`,
              `- 📖 **[User & Administrator Guide (\`USER_GUIDE.md\`)](${userGuideUrl})** — Step-by-step configuration, module usage, and troubleshooting.`,
              `- 🔒 **[Privacy, Security & Runs on Atlassian Architecture (\`PRIVACY_AND_SECURITY.md\`)](${privacySecurityUrl})** — 100% Native Forge (\`nodejs24.x\`), zero external remotes, zero data egress, and host-native storage details.`,
              ``,
              `> **Security Notice:** Never post API tokens, session cookies, or unredacted customer PII in public GitHub issues.`,
              ``,
              `— **EvidencePair LLC Support**`
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body,
            });
